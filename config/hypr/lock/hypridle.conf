# Managed by Quickshell
general {
    lock_cmd = pidof hyprlock || hyprlock -c "$HOME/.config/hypr/lock/hyprlock.conf"
    unlock_cmd = killall hyprlock
    before_sleep_cmd = pidof hyprlock || hyprlock -c "$HOME/.config/hypr/lock/hyprlock.conf"
    after_sleep_cmd = sh -c 'niri msg action power-on-monitors >/dev/null 2>&1 || hyprctl dispatch dpms on'
    ignore_dbus_inhibit = true
    ignore_systemd_inhibit = true
    ignore_wayland_inhibit = true
}

listener {
    timeout = 3120
    on-timeout = pidof hyprlock || hyprlock -c "$HOME/.config/hypr/lock/hyprlock.conf"
    ignore_inhibit = true
}

listener {
    timeout = 4140
    on-timeout = sh -c 'niri msg action power-off-monitors >/dev/null 2>&1 || hyprctl dispatch dpms off'
    on-resume = sh -c 'niri msg action power-on-monitors >/dev/null 2>&1 || hyprctl dispatch dpms on'
}

listener {
    timeout = 4740
    on-timeout = systemctl suspend
}
