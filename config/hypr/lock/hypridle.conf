# ~/.config/hypr/hypridle.conf
# UltraMode Versiyonu - Senin İstediğin Timeout'lar ve Komutlarla!

general {
    # Bu komut, hyprlock'ın çalışıp çalışmadığını kontrol eder.
    # Eğer çalışmıyorsa başlatır. loginctl lock-session çağrıldığında hep çalışır.
    lock_cmd = pidof hyprlock || hyprlock -c ~/.config/hypr/lock/hyprlock.conf

    # Kilit ekranı açıldığında hyprlock sürecini sonlandırır.
    # loginctl unlock-session çağrıldığında hep çalışır.
    unlock_cmd = killall hyprlock

    # Bilgisayar uykuya geçmeden önce oturumu kilitlemeyi garanti eder.
    before_sleep_cmd = loginctl lock-session

    # Bilgisayar uykudan uyandığında ekranı açar (DPMS on).
    # Her zaman gerekli olmayabilir ama garanti olsun.
    after_sleep_cmd = hyprctl dispatch dpms on

    # Uygulamaların kilitlenmeyi engelleme isteğini görmezden geliyoruz.
    # YouTube açıkken kilitlenme sorununu çözen anahtar ayar budur.
    ignore_dbus_inhibit = true
    ignore_systemd_inhibit = true
}

# --------------- DİNLEYİCİLER (LISTENER'LAR) ---------------
# Senin istediğin timeout'lara göre düzenlendi:

# 1. Ekran Parlaklığını Yarıya İndirme (1200 saniye = 20 dakika boşta kalınca)
listener {
    timeout = 1200                         # 20 dakika boşta kalınca
    on-timeout = brightnessctl set $(( $(brightnessctl g) / 2 )) # Parlaklığı yarıya indir
    on-resume = brightnessctl set $(( $(brightnessctl g) * 2 )) # Etkinlik olunca parlaklığı iki katına çıkar (eski haline getirir)
}

# 2. Ekranı Kilitleme (1300 saniye = 21 dakika 40 saniye boşta kalınca)
listener {
    timeout = 1300                             # 21 dakika 40 saniye boşta kalınca
    on-timeout = loginctl lock-session           # Oturumu kilitle (hyprlock'ı çağırır)
    # Senin örneğinde 'swaylock -f & sleep 1' vardı, biz hyprlock'ı kullanıyoruz.
    # Resume komutu burada genelde gerekmez, kilit açılınca oturum devam eder.
}

# 3. Ekranı Kapatma (1500 saniye = 25 dakika boşta kalınca)
listener {
    timeout = 1500                               # 25 dakika boşta kalınca
    on-timeout = hyprctl dispatch dpms off       # Ekranı kapat (DPMS off)
    on-resume = hyprctl dispatch dpms on         # Etkinlik olunca ekranı aç (DPMS on)
}

# 4. Bilgisayarı Uyku Moduna Alma (2000 saniye = 33 dakika 20 saniye boşta kalınca)
listener {
    timeout = 2000                              # 33 dakika 20 saniye boşta kalınca
    on-timeout = systemctl suspend               # Bilgisayarı uyku moduna al
    # Resume komutu burada genellikle systemctl suspend ile tetiklenen bir olay değildir.
}
