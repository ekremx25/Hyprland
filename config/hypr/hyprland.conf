# This file sources other files in `custom` folder
# You can keep your personal settings in `custom/*.conf`

$qsConfig = ii
exec = hyprctl dispatch submap global
submap = global

# Environment
source = custom/env.conf

# General setup
source = custom/execs.conf
source = custom/general.conf
source = custom/rules.conf
source = custom/keybinds.conf

# nwg-displays support
source = workspaces.conf
