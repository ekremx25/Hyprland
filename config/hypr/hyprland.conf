# This file sources other files in `custom` folder
# You can keep your personal settings in `custom/*.conf`

$qsConfig = ii
exec = hyprctl dispatch submap global
submap = global

# Environment
source = custom/env.conf

# General setup
source = custom/execs.conf
source = custom/general.conf
source = custom/rules.conf
source = custom/keybinds.conf

# nwg-displays support
source = workspaces.conf
#source = monitors.conf

# SmartComplete
exec-once = fcitx5 -d
exec-once = sleep 2 && fcitx5-remote -o

# SmartComplete — Input Method environment (exported to all child processes)
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = SDL_IM_MODULE,fcitx
env = GLFW_IM_MODULE,ibus
