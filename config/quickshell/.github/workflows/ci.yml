name: Quickshell CI

on:
  push:
    branches: [main]
    paths:
      - "config/quickshell/**"
  pull_request:
    branches: [main]
    paths:
      - "config/quickshell/**"

jobs:
  shell-lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: Lint helper scripts
        run: |
          shellcheck -S warning config/quickshell/scripts/*.sh config/quickshell/Services/core/*.sh

  json-lint:
    name: JSON lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y jq

      - name: Validate tracked Quickshell JSON files
        run: |
          set -e
          fail=0
          while IFS= read -r file; do
            if ! jq empty "$file" >/dev/null 2>&1; then
              echo "::error file=$file::Invalid JSON"
              fail=1
            fi
          done < <(git ls-files 'config/quickshell/*.json' 'config/quickshell/**/*.json')
          exit "$fail"
